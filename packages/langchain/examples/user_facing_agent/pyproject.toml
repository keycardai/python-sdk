[project]
name = "user-facing-agent-example"
version = "0.1.0"
description = "A user-facing LangChain agent acting on behalf of the caller, with consent pauses via LangGraph interrupts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keycardai-langchain",
    "langchain-anthropic>=1.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.uv.sources]
keycardai-langchain = { path = "../../", editable = true }

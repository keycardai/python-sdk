[project]
name = "keycardai-langchain"
dynamic = ["version"]
description = "LangChain integration for Keycard: delegated, per-tool-call access with brokered credentials"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keycard", email = "support@keycard.ai" }]
dependencies = [
    "httpx>=0.27.2",
    "keycardai-oauth>=0.24.0",
    "langchain>=1.2.11",
    "langgraph>=1.1.5",
]
keywords = ["langchain", "langgraph", "agents", "oauth", "token-exchange", "authentication", "keycard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
# Inbound authentication for a served agent (keycardai.langchain.auth).
# langgraph-sdk already arrives transitively through langgraph, but this module
# imports it directly, so it is declared. starlette is the genuinely new one:
# the bearer challenge needs an exception class that keeps response headers,
# which is why the module (and both imports) sit behind an extra.
serve = [
    "langgraph-sdk>=0.4.2",
    "starlette>=0.40.0",
]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    # The serve extra's own dependencies, repeated rather than referenced as
    # keycardai-langchain[serve] so a test install never reaches the index for
    # this package.
    "langgraph-sdk>=0.4.2",
    "starlette>=0.40.0",
    # The auth suite dispatches through the server's own handler resolution and
    # user normalization rather than a local reimplementation. Test-only, and
    # the suite skips itself where these cannot install (both need Python 3.11).
    "langgraph-api>=0.13.2 ; python_version >= '3.11'",
    "langgraph-runtime-inmem>=0.33.2 ; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/keycardai/python-sdk"
Repository = "https://github.com/keycardai/python-sdk"
Documentation = "https://docs.keycardai.com"
Issues = "https://github.com/keycardai/python-sdk/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern = "(?P<base>\\d+\\.\\d+\\.\\d+)-keycardai-langchain"
style = "pep440"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/keycardai"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, we'll handle case by case
]
isort = { combine-as-imports = true, known-first-party = ["keycardai"] }

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]

[tool.mypy]
strict = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["tests", "src/keycardai"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_customize"
version = "0.5.0"
tag_format = "${version}-keycardai-langchain"
ignored_tag_formats = ["${version}-*"]
update_changelog_on_bump = true
bump_message = "bump: keycardai-langchain $current_version → $new_version"
major_version_zero = true

[tool.commitizen.customize]
# Scoped bump detection: without bump_pattern/bump_map commitizen falls back to
# its default classifier, which matches any `feat(...)!:` regardless of scope.
changelog_pattern = "^(feat|fix|refactor|perf|test|revert)\\(keycardai-langchain\\)(!)?:"
bump_pattern = "^((?:feat|fix|refactor|perf|revert|BREAKING[\\- ]CHANGE)\\(keycardai-langchain\\)!?):"

[tool.commitizen.customize.bump_map]
"^.+\\(keycardai-langchain\\)!$" = "MAJOR"
"^BREAKING[\\- ]CHANGE" = "MAJOR"
"^feat" = "MINOR"
"^fix" = "PATCH"
"^refactor" = "PATCH"
"^perf" = "PATCH"
"^revert" = "PATCH"

[tool.commitizen.customize.bump_map_major_version_zero]
"^.+\\(keycardai-langchain\\)!$" = "MINOR"
"^BREAKING[\\- ]CHANGE" = "MINOR"
"^feat" = "MINOR"
"^fix" = "PATCH"
"^refactor" = "PATCH"
"^perf" = "PATCH"
"^revert" = "PATCH"

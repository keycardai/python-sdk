[project]
name = "user-facing-agent-example"
version = "0.1.0"
description = "A user-facing Pydantic AI agent acting on behalf of the caller, with consent pauses via deferred tool approval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keycardai-pydantic-ai",
    "pydantic-ai-slim[anthropic]>=2.60,<3",
    "httpx>=0.27.0,<1.0.0",
]

[tool.uv.sources]
keycardai-pydantic-ai = { path = "../../", editable = true }

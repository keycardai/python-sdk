[project]
name = "keycardai-pydantic-ai"
dynamic = ["version"]
description = "Pydantic AI integration for Keycard: delegated, per-tool-call access with brokered credentials"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keycard", email = "support@keycard.ai" }]
dependencies = [
    "keycardai-oauth>=0.35.0",
    "pydantic-ai-slim>=2.60,<3",
]
keywords = ["pydantic-ai", "agents", "oauth", "token-exchange", "authentication", "keycard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/keycardai/python-sdk"
Repository = "https://github.com/keycardai/python-sdk"
Documentation = "https://docs.keycardai.com"
Issues = "https://github.com/keycardai/python-sdk/issues"

[tool.uv.sources]
# keycardai-oauth is path-linked so a breaking sibling change fails this package's CI.
keycardai-oauth = { path = "../oauth", editable = true }

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern = "(?P<base>\\d+\\.\\d+\\.\\d+)-keycardai-pydantic-ai"
style = "pep440"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/keycardai"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, we'll handle case by case
]
isort = { combine-as-imports = true, known-first-party = ["keycardai"] }

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]

[tool.mypy]
strict = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["tests", "src/keycardai"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.commitizen]
name = "cz_customize"
version = "0.2.0"
tag_format = "${version}-keycardai-pydantic-ai"
# Ignores sibling packages' tags only; it must not match this package's own tag, because commitizen applies ignored formats before tag_format.
ignored_tag_formats = ["${version}-keycardai-(?!pydantic-ai$).*"]
update_changelog_on_bump = true
bump_message = "bump: keycardai-pydantic-ai $current_version → $new_version"
major_version_zero = true

[tool.commitizen.customize]
# Scoped bump detection: without bump_pattern/bump_map commitizen falls back to
# its default classifier, which matches any `feat(...)!:` regardless of scope.
changelog_pattern = "^(feat|fix|refactor|perf|test|revert)\\(keycardai-pydantic-ai\\)(!)?:"
bump_pattern = "^((?:feat|fix|refactor|perf|revert|BREAKING[\\- ]CHANGE)\\(keycardai-pydantic-ai\\)!?):"

[tool.commitizen.customize.bump_map]
"^.+\\(keycardai-pydantic-ai\\)!$" = "MAJOR"
"^BREAKING[\\- ]CHANGE" = "MAJOR"
"^feat" = "MINOR"
"^fix" = "PATCH"
"^refactor" = "PATCH"
"^perf" = "PATCH"
"^revert" = "PATCH"

[tool.commitizen.customize.bump_map_major_version_zero]
"^.+\\(keycardai-pydantic-ai\\)!$" = "MINOR"
"^BREAKING[\\- ]CHANGE" = "MINOR"
"^feat" = "MINOR"
"^fix" = "PATCH"
"^refactor" = "PATCH"
"^perf" = "PATCH"
"^revert" = "PATCH"

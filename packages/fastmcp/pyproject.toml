[project]
name = "keycardai-fastmcp"
dynamic = ["version"]
description = "FastMCP integration for Keycard OAuth client with automated token exchange and authentication"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keycard", email = "support@keycard.ai" }]
dependencies = [
    "pydantic>=2.11.7",
    "pydantic-settings>=2.7.1",
    "httpx>=0.27.2",
    "keycardai-oauth>=0.7.0",
    "fastmcp>=3.1.0",
    # Capped deliberately. fastmcp 3.x pins mcp<2.0 and keycardai-mcp 0.27+
    # requires mcp>=2.0, so the two are unsatisfiable together. Without this
    # cap pip silently backtracks keycardai-mcp to 0.26.0 and freezes there.
    # Lift to the 2.0 line together with the fastmcp 4.x bump (ECO-198).
    "keycardai-mcp>=0.15.0,<0.27",
]
keywords = ["fastmcp", "mcp", "model-context-protocol", "oauth", "token-exchange", "authentication", "keycard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/keycardai/python-sdk"
Repository = "https://github.com/keycardai/python-sdk"
Documentation = "https://docs.keycardai.com"
Issues = "https://github.com/keycardai/python-sdk/issues"

[tool.uv.sources]
# Only keycardai-mcp comes from the index: it is on mcp>=2.0 and this package is
# on mcp<2.0, so the local copy is genuinely unusable here. Everything else is
# path-linked so a breaking change in a sibling still fails this package's CI.
keycardai-oauth = { path = "../oauth", editable = true }
# keycardai-starlette stays on the index: it is a transitive dependency via
# keycardai-mcp, and tool.uv.sources only redirects direct dependencies.

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern = "(?P<base>\\d+\\.\\d+\\.\\d+)-keycardai-fastmcp"
style = "pep440"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/keycardai"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, we'll handle case by case
]
isort = { combine-as-imports = true, known-first-party = ["keycardai"] }

[tool.ruff.lint.per-file-ignores]
# B008: auth_provider.grant(...) is a dependency declaration (like
# fastapi.Depends): calling it in a parameter default is the intended
# injection spelling for tools.
"tests/**/*.py" = ["T20", "B008"]
"examples/**/*.py" = ["B008"]

[tool.mypy]
strict = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["tests", "src/keycardai"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.commitizen]
name = "cz_customize"
version = "0.5.0"
tag_format = "${version}-keycardai-fastmcp"
ignored_tag_formats = ["${version}-*"]
update_changelog_on_bump = true
bump_message = "bump: keycardai-fastmcp $current_version → $new_version"
major_version_zero = true

[tool.commitizen.customize]
changelog_pattern = "^(feat|fix|refactor|perf|test|build|ci|revert)\\(keycardai-fastmcp\\)(!)?:"
